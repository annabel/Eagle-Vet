{{define "content"}}<section class="wrap section team-page" id="meettheteam"><div class="section-heading"><h1>Get to know your <span class="accent">Eagle Vet team</span></h1></div><div class="team-grid">{{range $i, $person := .Staff}}
<article class="person">
 <button class="person-photo" type="button" data-bio-open="bio-{{$i}}" aria-haspopup="dialog" aria-controls="bio-{{$i}}" aria-label="Read bio for {{.Name}}"><img {{template "image-attrs" (image .Image "thumbnail")}} sizes="(max-width: 600px) calc(50vw - 30px), (max-width: 850px) calc(50vw - 45px), (max-width: 1100px) calc(33.33vw - 45px), (max-width: 1392px) calc(33.33vw - 61px), 404px" alt="{{.Name}}" {{if ge $i 2}}loading="lazy"{{end}}></button>
 <div class="person-info"><h3>{{.Name}}</h3><p class="person-role">{{.Role}}</p><button class="bio-trigger" type="button" data-bio-open="bio-{{$i}}" aria-haspopup="dialog" aria-controls="bio-{{$i}}" aria-label="Learn more about {{.Name}}">Learn more <span aria-hidden="true">↗</span></button></div>
 <dialog id="bio-{{$i}}" class="bio-dialog" aria-labelledby="bio-title-{{$i}}" aria-describedby="bio-role-{{$i}}">
  <div class="bio-dialog-header"><button class="bio-close" type="button" data-bio-close aria-label="Close biography" autofocus><span aria-hidden="true">×</span></button></div>
  <div class="bio-dialog-body">{{with image .Image "portrait"}}<img data-src="{{.Src}}" {{if .Srcset}}data-srcset="{{.Srcset}}"{{end}} sizes="(max-width: 352px) calc(100vw - 92px), 260px" width="{{.Width}}" height="{{.Height}}" alt="{{$person.Name}}">{{end}}<div><h2 id="bio-title-{{$i}}">{{.Name}}</h2><p class="bio-role" id="bio-role-{{$i}}">{{.Role}}</p><p class="bio-copy">{{.Bio}}</p></div></div>
 </dialog>
</article>{{end}}</div></section>{{end}}
