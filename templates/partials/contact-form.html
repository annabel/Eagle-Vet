{{define "contact-form"}}<form class="demo-form" method="post" data-demo-form><div class="form-row"><label>Your name<input type="text" autocomplete="name" required maxlength="150"></label><label>Email address<input type="email" autocomplete="email" required maxlength="254"></label></div><label>How can we help?<textarea rows="5" required maxlength="4000"></textarea></label><button class="button" type="button" disabled data-demo-submit>Preview message <span aria-hidden="true">↗</span></button><noscript><p>This form is a non-submitting preview. Please call the clinic.</p></noscript><p class="form-result" role="status" tabindex="-1" hidden></p></form>{{end}}
