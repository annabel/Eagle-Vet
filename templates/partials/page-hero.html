{{define "page-hero"}}<section class="page-hero wrap {{if not .Image}}text-hero{{end}}"><div><div class="breadcrumbs"><a href="/">Home</a><span aria-hidden="true">/</span><span>{{.Name}}</span></div><div class="eyebrow">{{.Eyebrow}}</div><h1>{{.Heading}}<br><span class="accent">{{.Accent}}</span></h1><p>{{.Intro}}</p>{{if eq .Name "About"}}<a class="text-link" href="#meettheteam">Meet the team <span aria-hidden="true">↓</span></a>{{else if eq .Name "Services"}}<a class="button" href="/appointment">Request a visit <span aria-hidden="true">↗</span></a>{{end}}</div>{{if .Image}}<div class="page-hero-art"><img src="{{.Image}}" {{if eq .Template "visit"}}width="1871" height="840"{{else}}width="1000" height="1000"{{end}} alt="{{.ImageAlt}}" fetchpriority="high">{{if ne .Template "visit"}}<span class="hero-spark" aria-hidden="true">{{template "star-doodle"}}</span><span class="image-sticker">A little more<br>heart.</span>{{end}}</div>{{end}}</section>{{end}}
